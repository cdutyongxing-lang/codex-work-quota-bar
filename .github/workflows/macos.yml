name: macOS build and release draft

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core and stdio tests
        run: bash macos/test.sh
      - name: Build universal application
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: |
            macos/dist/CodexWorkQuotaBar-macOS.zip
            macos/dist/CodexWorkQuotaBar-macOS.zip.sha256
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macOS
          path: release-assets
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/CodexWorkQuotaBar-macOS.zip \
            release-assets/CodexWorkQuotaBar-macOS.zip.sha256 \
            --verify-tag --draft \
            --title "Codex Work Quota Bar $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md
